<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ダーツ自動判定 Ver 6.1</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background-color: #121212; color: #fff; margin: 0; padding: 10px; touch-action: manipulation; }
    h1 { font-size: 1.2rem; margin: 5px 0; }
    .version-tag { font-size: 0.8rem; color: #00ffcc; }
    .setup-panel { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 12px; max-width: 420px; margin: 10px auto; }
    .setup-group { margin-bottom: 10px; text-align: left; }
    .setup-group label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 4px; }
    select, input[type="text"] { width: 100%; padding: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
    .peer-id-box { background: #000; border: 1px dashed #00ffcc; padding: 8px; font-family: monospace; font-size: 1.1rem; color: #00ffcc; margin: 5px 0; word-break: break-all; border-radius: 6px; text-align: center; }
    
    #board-container { position: relative; display: inline-block; margin: 5px auto; }
    video { display: none; }
    canvas { display: block; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8); background: #000; width: 340px; height: 340px; }
    #status-msg { font-size: 1rem; color: #00ffcc; margin: 5px 0; font-weight: bold; min-height: 1.5rem; }
    
    .game-info { display: flex; justify-content: space-between; align-items: center; max-width: 420px; margin: 5px auto; background: #222; padding: 8px 12px; border-radius: 8px; }
    .player-turn { font-size: 1.1rem; font-weight: bold; color: #ff9800; }
    .scoreboard { display: flex; justify-content: center; gap: 6px; max-width: 420px; margin: 8px auto; }
    .p-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 6px; flex: 1; }
    .p-card.active { border-color: #ff9800; box-shadow: 0 0 8px rgba(255,152,0,0.5); }
    .p-score { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .throws-container { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
    .throw-box { background: #222; border: 1px solid #444; border-radius: 8px; padding: 6px 10px; min-width: 70px; }
    
    .controls { display: flex; justify-content: center; gap: 6px; max-width: 420px; margin: 5px auto; flex-wrap: wrap; }
    button { padding: 10px 12px; font-size: 0.9rem; border: none; border-radius: 6px; background-color: #333; color: #fff; cursor: pointer; flex-grow: 1; margin: 2px; }
    button.action-btn { background-color: #ff9800; font-weight: bold; color: #000; }
    button.confirm-btn { background-color: #00cc88; font-weight: bold; color: #000; font-size: 1rem; padding: 10px; }
  </style>
</head>
<body>

  <h1>🎯 ダーツ自動判定 <span class="version-tag">Ver 6.1</span></h1>
  <video id="video" autoplay playsinline></video>

  <!-- 設定パネル -->
  <div class="setup-panel" id="setup-panel">
    <div class="setup-group">
      <label>端末役割</label>
      <select id="device-role" onchange="toggleRoleUI()">
        <option value="single">1台でプレイ (カメラ＋表示)</option>
        <option value="display">ディスプレイ (表示専用)</option>
        <option value="camera">カメラ (撮影専用)</option>
      </select>
    </div>

    <div id="display-id-group" class="setup-group" style="display:none;">
      <label>この端末の接続用ID (カメラ側に登録)</label>
      <div class="peer-id-box" id="my-peer-id">接続中...</div>
      <button onclick="initPeer()" style="font-size: 0.75rem; padding: 4px; margin-top: 4px;">🔄 IDを再発行</button>
    </div>

    <div id="remote-input-group" class="setup-group" style="display:none;">
      <label>接続用 ID (ディスプレイ側のIDを入力)</label>
      <input type="text" id="target-peer-id" placeholder="例: 1234-abcd">
    </div>

    <button class="action-btn" style="width: 100%; margin-top: 10px;" onclick="startApp()">🎮 スタート</button>
  </div>

  <div class="controls" id="cam-controls" style="display:none;">
    <button class="action-btn" onclick="startCamera()">📷 1. カメラ起動</button>
    <button class="action-btn" id="btn-base" onclick="captureBase()" disabled>🎯 2. 基準撮影(判定開始)</button>
  </div>

  <div id="board-container" style="display:none;">
    <canvas id="dartboard" width="720" height="720"></canvas>
  </div>

  <div id="status-msg"></div>

  <div id="game-ui" style="display:none;">
    <div class="game-info">
      <div class="player-turn" id="turn-display">P1 の番です</div>
      <button onclick="resetGame()" style="flex-grow:0; padding: 4px 8px; font-size: 0.8rem;">🔄 リセット</button>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <div class="throws-container">
      <div class="throw-box">1投目: <span id="score-1">-</span></div>
      <div class="throw-box">2投目: <span id="score-2">-</span></div>
      <div class="throw-box">3投目: <span id="score-3">-</span></div>
    </div>
    <button class="confirm-btn" id="btn-confirm" onclick="confirmRound()" style="width: 100%; margin-top: 10px;" disabled>✅ スコア確定</button>
  </div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('dartboard');
  const ctx = canvas.getContext('2d');
  const statusMsg = document.getElementById('status-msg');

  let peer = null;
  let conn = null;
  let role = 'single';

  const BOARD_NUMBERS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  const procCanvas = document.createElement('canvas');
  procCanvas.width = 180; procCanvas.height = 180;
  const procCtx = procCanvas.getContext('2d');

  let boardCenter = { x: 360, y: 360, r: 280 };
  let baseImageData = null;
  let isDetecting = false;
  let throws = [null, null, null];
  let currentThrowIndex = 0;
  let lastHitTime = 0;

  let gameState = {
    players: [ { name: "P1", score: 501 }, { name: "P2", score: 501 } ],
    currentPlayer: 0
  };

  function toggleRoleUI() {
    role = document.getElementById('device-role').value;
    const isDisplay = (role === 'display');
    const isCamera = (role === 'camera');
    
    document.getElementById('display-id-group').style.display = isDisplay ? 'block' : 'none';
    document.getElementById('remote-input-group').style.display = isCamera ? 'block' : 'none';

    if (isDisplay && !peer) {
      initPeer();
    }
  }

  function initPeer() {
    const idBox = document.getElementById('my-peer-id');
    if (idBox) idBox.innerText = "接続サーバーに要求中...";

    if (peer) peer.destroy();
    
    peer = new Peer();

    peer.on('open', id => {
      if (idBox) idBox.innerText = id;
    });

    peer.on('connection', c => {
      conn = c;
      setupConnection();
    });

    peer.on('error', err => {
      if (idBox) idBox.innerText = "エラー: 再発行を押してください";
    });
  }

  function setupConnection() {
    statusMsg.innerText = "⚡ 通信接続完了！";
    conn.on('data', data => {
      if (data.type === 'SYNC_BOARD') {
        boardCenter = data.boardCenter;
        throws = data.throws;
        gameState = data.gameState;
        drawCanvasFromData(data.imgData);
        updateUI();
      }
    });
  }

  function startApp() {
    role = document.getElementById('device-role').value;
    document.getElementById('setup-panel').style.display = 'none';

    if (role === 'camera') {
      const targetId = document.getElementById('target-peer-id').value.trim();
      if (!targetId) {
        alert("ディスプレイに表示されているIDを入力してください。");
        document.getElementById('setup-panel').style.display = 'block';
        return;
      }
      if (!peer) peer = new Peer();
      conn = peer.connect(targetId);
      setupConnection();
      document.getElementById('cam-controls').style.display = 'flex';
      document.getElementById('board-container').style.display = 'inline-block';
    } else if (role === 'display') {
      document.getElementById('board-container').style.display = 'inline-block';
      document.getElementById('game-ui').style.display = 'block';
    } else {
      document.getElementById('cam-controls').style.display = 'flex';
      document.getElementById('board-container').style.display = 'inline-block';
      document.getElementById('game-ui').style.display = 'block';
    }
    renderScoreboard();
  }

  async function startCamera() {
    statusMsg.innerText = "カメラ起動中...";
    try {
      let stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 1280 } }
      });
      video.srcObject = stream;
      await video.play();
      document.getElementById('btn-base').disabled = false;
      statusMsg.innerText = "ボード全体を画面中央に合わせて「2. 基準撮影」を押してください。";
      requestAnimationFrame(updateLoop);
    } catch (err) { alert("カメラエラー: " + err); }
  }

  function captureBase() {
    autoAlignBoard();
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    baseImageData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
    throws = [null, null, null]; currentThrowIndex = 0;
    isDetecting = true;
    updateUI();
    statusMsg.innerText = "🎯 判定中... (1投目を投げてください)";
  }

  function autoAlignBoard() {
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    const imgData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
    const data = imgData.data;
    let sumX = 0, sumY = 0, count = 0;
    for (let i = 0; i < data.length; i += 4) {
      const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
      if (brightness > 60 && brightness < 220) {
        const pixelIdx = i / 4;
        sumX += pixelIdx % procCanvas.width;
        sumY += Math.floor(pixelIdx / procCanvas.width);
        count++;
      }
    }
    if (count > 0) {
      boardCenter.x = (sumX / count) / procCanvas.width * canvas.width;
      boardCenter.y = (sumY / count) / procCanvas.height * canvas.height;
    }
  }

  function updateLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      if (isDetecting && baseImageData && currentThrowIndex < 3) {
        if (Date.now() - lastHitTime > 3000) detectDartHit();
      }

      drawBoardOverlay();
      drawHitPoints();

      if (conn && conn.open) sendDataToDisplay();
    }
    requestAnimationFrame(updateLoop);
  }

  function detectDartHit() {
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    const currentData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);

    let changedPixels = [];
    const totalPixels = procCanvas.width * procCanvas.height;

    for (let i = 0; i < currentData.data.length; i += 4) {
      const diff = Math.abs(currentData.data[i] - baseImageData.data[i]) +
                   Math.abs(currentData.data[i+1] - baseImageData.data[i+1]) +
                   Math.abs(currentData.data[i+2] - baseImageData.data[i+2]);

      if (diff > 130) {
        const pixelIdx = i / 4;
        changedPixels.push({ x: pixelIdx % procCanvas.width, y: Math.floor(pixelIdx / procCanvas.width) });
      }
    }

    const diffCount = changedPixels.length;
    if (diffCount > totalPixels * 0.12) {
      statusMsg.innerText = "⚠️ 大きな動きを検知。静止待機中...";
      baseImageData = currentData;
      return;
    }

    if (diffCount >= 15 && diffCount <= totalPixels * 0.10) {
      const normCenterX = (boardCenter.x / canvas.width) * procCanvas.width;
      const normCenterY = (boardCenter.y / canvas.height) * procCanvas.height;

      let minDistanceToCenter = Infinity;
      let tipPx = null;

      changedPixels.forEach(p => {
        const dist = Math.hypot(p.x - normCenterX, p.y - normCenterY);
        if (dist < minDistanceToCenter) {
          minDistanceToCenter = dist;
          tipPx = p;
        }
      });

      if (tipPx) {
        const canvasX = (tipPx.x / procCanvas.width) * canvas.width;
        const canvasY = (tipPx.y / procCanvas.height) * canvas.height;
        const score = calculateScore(canvasX, canvasY);
        
        throws[currentThrowIndex] = { label: score.text, pts: score.pts, x: canvasX, y: canvasY };
        lastHitTime = Date.now();
        baseImageData = currentData;

        currentThrowIndex++;
        if (currentThrowIndex >= 3) {
          isDetecting = false;
          statusMsg.innerText = "3投完了！「スコア確定」を押してください。";
        } else {
          statusMsg.innerText = `🎯 (${currentThrowIndex + 1}投目判定中...)`;
        }
        updateUI();
      }
    }
  }

  function calculateScore(x, y) {
    const dx = x - boardCenter.x;
    const dy = y - boardCenter.y;
    const r = Math.hypot(dx, dy) / boardCenter.r;

    if (r <= 0.04) return { text: "D-BULL", pts: 50 };
    if (r <= 0.09) return { text: "S-BULL", pts: 25 };
    if (r > 1.0)   return { text: "OUT", pts: 0 };

    let angleRad = Math.atan2(dx, -dy);
    let angleDeg = (angleRad * 180 / Math.PI + 360) % 360;
    let index = Math.floor(((angleDeg + 9) % 360) / 18);
    let num = BOARD_NUMBERS[index];

    if (r >= 0.58 && r <= 0.65) return { text: `T${num}`, pts: num * 3 };
    if (r >= 0.92 && r <= 1.0) return { text: `D${num}`, pts: num * 2 };
    return { text: `S${num}`, pts: num };
  }

  function updateUI() {
    for (let i = 0; i < 3; i++) {
      const scoreText = document.getElementById(`score-${i+1}`);
      if (scoreText) scoreText.innerText = throws[i] ? throws[i].label : "-";
    }
    const btnConfirm = document.getElementById('btn-confirm');
    if (btnConfirm) btnConfirm.disabled = (currentThrowIndex === 0 && !throws.some(t => t !== null));
    renderScoreboard();
  }

  function renderScoreboard() {
    const container = document.getElementById('scoreboard');
    if (!container) return;
    container.innerHTML = "";
    gameState.players.forEach((p, idx) => {
      const isActive = idx === gameState.currentPlayer;
      container.innerHTML += `
        <div class="p-card ${isActive ? 'active' : ''}">
          <div style="font-size:0.8rem; color:#aaa;">${p.name}</div>
          <div class="p-score">${p.score}</div>
        </div>
      `;
    });
    document.getElementById('turn-display').innerText = `${gameState.players[gameState.currentPlayer].name} の番です`;
  }

  function confirmRound() {
    let roundTotal = 0;
    throws.forEach(t => { if (t) roundTotal += t.pts; });

    let player = gameState.players[gameState.currentPlayer];
    if (player.score - roundTotal >= 0) player.score -= roundTotal;

    gameState.currentPlayer = (gameState.currentPlayer + 1) % gameState.players.length;
    throws = [null, null, null]; currentThrowIndex = 0;
    updateUI(); captureBase();
  }

  function resetGame() {
    gameState.players.forEach(p => p.score = 501);
    gameState.currentPlayer = 0;
    throws = [null, null, null]; currentThrowIndex = 0;
    updateUI();
    if (video.readyState === video.HAVE_ENOUGH_DATA) captureBase();
  }

  function drawBoardOverlay() {
    const { x, y, r } = boardCenter;
    ctx.strokeStyle = "rgba(0, 255, 204, 0.6)"; ctx.lineWidth = 2;
    [0.04, 0.09, 0.58, 0.65, 0.92, 1.0].forEach(ratio => {
      ctx.beginPath(); ctx.arc(x, y, r * ratio, 0, Math.PI * 2); ctx.stroke();
    });
    for (let i = 0; i < 20; i++) {
      let angle = (i * 18 - 9) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(x + r * 0.09 * Math.sin(angle), y - r * 0.09 * Math.cos(angle));
      ctx.lineTo(x + r * Math.sin(angle), y - r * Math.cos(angle));
      ctx.stroke();
    }
  }

  function drawHitPoints() {
    throws.forEach((t, idx) => {
      if (t && t.x && t.y) {
        ctx.beginPath(); ctx.arc(t.x, t.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 0, 85, 0.9)"; ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(idx + 1, t.x, t.y);
      }
    });
  }

  function sendDataToDisplay() {
    const dataURL = canvas.toDataURL('image/jpeg', 0.5);
    conn.send({ type: 'SYNC_BOARD', imgData: dataURL, boardCenter, throws, gameState });
  }

  function drawCanvasFromData(dataURL) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = dataURL;
  }
</script>
</body>
</html>
