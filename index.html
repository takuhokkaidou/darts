<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ダーツ自動色判定プロトタイプ</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 10px; }
    #board-container { position: relative; display: inline-block; }
    canvas { border-radius: 12px; background: #000; width: 340px; height: 340px; }
    button { padding: 10px 16px; font-size: 0.9rem; border: none; border-radius: 6px; background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; margin: 5px; }
    video { display: none; }
  </style>
</head>
<body>

  <h1>🎨 色判定（赤・青検出）ダーツボード枠あわせ</h1>
  <video id="video" autoplay playsinline></video>

  <div>
    <button onclick="startCamera()">📷 1. カメラ起動</button>
    <button onclick="autoDetectColorBoard()">🎨 2. 色から枠を自動検出</button>
  </div>

  <div id="board-container">
    <canvas id="dartboard" width="720" height="720"></canvas>
  </div>

  <div id="status-msg" style="color: #00ffcc; margin-top: 10px;"></div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('dartboard');
  const ctx = canvas.getContext('2d');
  const statusMsg = document.getElementById('status-msg');

  let points = [ { x: 360, y: 80 }, { x: 640, y: 360 }, { x: 360, y: 640 }, { x: 80, y: 360 } ];

  async function startCamera() {
    try {
      let stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 1280 } }
      });
      video.srcObject = stream;
      await video.play();
      statusMsg.innerText = "カメラが起動しました。ボード全体を写して「色から枠を自動検出」を押してください。";
      requestAnimationFrame(updateLoop);
    } catch (err) { alert("カメラエラー: " + err); }
  }

  function updateLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      drawOverlay();
    }
    requestAnimationFrame(updateLoop);
  }

  // RGBをHSV色空間に変換するヘルパー関数
  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, v = max;
    let d = max - min;
    s = max === 0 ? 0 : d / max;
    if (max === min) {
      h = 0;
    } else {
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    return [h * 360, s * 100, v * 100];
  }

  // 色判定ロジック（赤と青の領域を検索）
  function autoDetectColorBoard() {
    statusMsg.innerText = "ボードの色（赤・青）を解析中...";

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;

    let redPixels = [];
    let bluePixels = [];

    // ピクセルをスキャン（計算軽量化のため4ピクセル飛ばし）
    for (let y = 0; y < canvas.height; y += 4) {
      for (let x = 0; x < canvas.width; x += 4) {
        let i = (y * canvas.width + x) * 4;
        let r = data[i], g = data[i+1], b = data[i+2];

        let [h, s, v] = rgbToHsv(r, g, b);

        // 赤色の判定 (Hue: 340-360 または 0-15, Saturation > 40%, Value > 30%)
        if ((h > 340 || h < 15) && s > 40 && v > 30) {
          redPixels.push({ x, y });
        }
        // 青/緑系（ハードボードのグリーン含む）の判定 (Hue: 170-250)
        else if (h >= 160 && h <= 250 && s > 35 && v > 25) {
          bluePixels.push({ x, y });
        }
      }
    }

    const allBoardPixels = [...redPixels, ...bluePixels];

    if (allBoardPixels.length < 100) {
      statusMsg.innerText = "❌ ボードの色（赤・青）を十分に検出できませんでした。照明を明るくするか近づけてください。";
      return;
    }

    // 検出した色の最外郭（上下左右の端）を検出
    let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
    allBoardPixels.forEach(p => {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    });

    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;

    // 検出した外郭を4点座標にセット
    points = [
      { x: centerX, y: minY }, // 上
      { x: maxX,    y: centerY }, // 右
      { x: centerX, y: maxY }, // 下
      { x: minX,    y: centerY }  // 左
    ];

    statusMsg.innerText = "✅ 色検知成功！検出した枠に合わせて調整しました。";
  }

  function drawOverlay() {
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    ctx.lineTo(points[1].x, points[1].y);
    ctx.lineTo(points[2].x, points[2].y);
    ctx.lineTo(points[3].x, points[3].y);
    ctx.closePath();
    ctx.stroke();

    points.forEach(p => {
      ctx.fillStyle = "#ff0055";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
      ctx.fill();
    });
  }
</script>
</body>
</html>
