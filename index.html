<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ダーツ自動判定 Ver 7.0</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #121212; color: #fff; margin: 0; padding: 10px; touch-action: manipulation; }
    h1 { font-size: 1.2rem; margin: 5px 0; }
    .version-tag { font-size: 0.8rem; color: #00ffcc; }
    .setup-panel { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 12px; max-width: 420px; margin: 10px auto; }
    .setup-group { margin-bottom: 10px; text-align: left; }
    .setup-group label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 4px; }
    select, input[type="text"] { width: 100%; padding: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
    
    #board-container { position: relative; display: inline-block; margin: 5px auto; }
    video { display: none; }
    canvas { display: block; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8); background: #000; width: 340px; height: 340px; cursor: crosshair; }
    #status-msg { font-size: 1rem; color: #00ffcc; margin: 5px 0; font-weight: bold; min-height: 1.5rem; }
    
    .guide-box { background: #181818; border: 1px solid #00ffcc; border-radius: 8px; padding: 10px; max-width: 420px; margin: 10px auto; font-size: 0.85rem; text-align: left; }
    
    .game-info { display: flex; justify-content: space-between; align-items: center; max-width: 420px; margin: 5px auto; background: #222; padding: 8px 12px; border-radius: 8px; }
    .player-turn { font-size: 1.1rem; font-weight: bold; color: #ff9800; }
    .scoreboard { display: flex; justify-content: center; gap: 6px; max-width: 420px; margin: 8px auto; }
    .p-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 6px; flex: 1; }
    .p-card.active { border-color: #ff9800; box-shadow: 0 0 8px rgba(255,152,0,0.5); }
    .p-score { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .throws-container { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
    .throw-box { background: #222; border: 1px solid #444; border-radius: 8px; padding: 6px 10px; min-width: 70px; cursor: pointer; }
    .throw-box.active { border-color: #00ffcc; box-shadow: 0 0 8px #00ffcc; }
    
    button { padding: 10px 12px; font-size: 0.9rem; border: none; border-radius: 6px; background-color: #333; color: #fff; cursor: pointer; flex-grow: 1; margin: 2px; }
    button.action-btn { background-color: #ff9800; font-weight: bold; color: #000; }
    button.confirm-btn { background-color: #00cc88; font-weight: bold; color: #000; font-size: 1rem; padding: 10px; }
  </style>
</head>
<body>

  <h1>🎯 ダーツ自動判定 <span class="version-tag">Ver 7.0 (4点指定補正)</span></h1>
  <video id="video" autoplay playsinline></video>

  <div class="setup-panel" id="setup-panel">
    <div class="setup-group">
      <label>端末役割</label>
      <select id="device-role" onchange="toggleRoleUI()">
        <option value="single">1台でプレイ (カメラ＋表示)</option>
        <option value="display">ディスプレイ (表示専用)</option>
        <option value="camera">カメラ (撮影専用)</option>
      </select>
    </div>
    <div id="remote-input-group" class="setup-group" style="display:none;">
      <label>接続用 ID</label>
      <input type="text" id="target-peer-id" placeholder="例: 1234">
    </div>
    <button class="action-btn" style="width: 100%;" onclick="startApp()">🎮 スタート</button>
  </div>

  <div class="controls" id="cam-controls" style="display:none;">
    <button class="action-btn" onclick="startCamera()">📷 1. カメラ起動</button>
    <button class="action-btn" id="btn-base" onclick="captureBase()" disabled>🎯 2. 基準撮影(判定開始)</button>
  </div>

  <div id="board-container" style="display:none;">
    <canvas id="dartboard" width="720" height="720"></canvas>
  </div>

  <div class="guide-box" id="guide-box" style="display:none;">
    📌 <b>4点補正ガイド:</b><br>
    画面の枠線をドラッグ（またはタップ）して、ボードの<b>ダブルリングの外枠4点</b>（①20の上 ②6の右 ③3の下 ④11の左）に合わせてください。
    <br><button onclick="resetPoints()" style="margin-top:5px; font-size:0.75rem;">点をリセット</button>
  </div>

  <div id="status-msg"></div>

  <div id="game-ui" style="display:none;">
    <div class="game-info">
      <div class="player-turn" id="turn-display">P1 の番です</div>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <div class="throws-container">
      <div class="throw-box" id="box-1">1投目: <span id="score-1">-</span></div>
      <div class="throw-box" id="box-2">2投目: <span id="score-2">-</span></div>
      <div class="throw-box" id="box-3">3投目: <span id="score-3">-</span></div>
    </div>
    <button class="confirm-btn" id="btn-confirm" onclick="confirmRound()" style="width: 100%;" disabled>✅ スコア確定</button>
  </div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('dartboard');
  const ctx = canvas.getContext('2d');
  const statusMsg = document.getElementById('status-msg');

  // 補正用の4点座標（初期位置：20の上, 6の右, 3の下, 11の左）
  let points = [
    { x: 360, y: 80 },  // 上 (20)
    { x: 640, y: 360 }, // 右 (6)
    { x: 360, y: 640 }, // 下 (3)
    { x: 80,  y: 360 }  // 左 (11)
  ];
  let draggingIdx = -1;

  const BOARD_NUMBERS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  const procCanvas = document.createElement('canvas');
  procCanvas.width = 180; procCanvas.height = 180;
  const procCtx = procCanvas.getContext('2d');

  let baseImageData = null;
  let isDetecting = false;
  let throws = [null, null, null];
  let currentThrowIndex = 0;

  // キャンバスのタッチ/ドラッグイベント処理
  canvas.addEventListener('mousedown', handlePointerDown);
  canvas.addEventListener('mousemove', handlePointerMove);
  window.addEventListener('mouseup', () => draggingIdx = -1);
  
  canvas.addEventListener('touchstart', (e) => { handlePointerDown(e.touches[0]); e.preventDefault(); });
  canvas.addEventListener('touchmove', (e) => { handlePointerMove(e.touches[0]); e.preventDefault(); });
  window.addEventListener('touchend', () => draggingIdx = -1);

  function handlePointerDown(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    const x = (e.clientX - rect.left) * scale;
    const y = (e.clientY - rect.top) * scale;

    // 最も近い制御点を探す
    points.forEach((p, idx) => {
      if (Math.hypot(p.x - x, p.y - y) < 40) draggingIdx = idx;
    });
  }

  function handlePointerMove(e) {
    if (draggingIdx !== -1) {
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      points[draggingIdx].x = (e.clientX - rect.left) * scale;
      points[draggingIdx].y = (e.clientY - rect.top) * scale;
    }
  }

  function resetPoints() {
    points = [ { x: 360, y: 80 }, { x: 640, y: 360 }, { x: 360, y: 640 }, { x: 80, y: 360 } ];
  }

  async function startCamera() {
    statusMsg.innerText = "カメラ起動中...";
    try {
      let stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 1280 } }
      });
      video.srcObject = stream;
      await video.play();
      document.getElementById('btn-base').disabled = false;
      document.getElementById('guide-box').style.display = 'block';
      statusMsg.innerText = "4つのポイントをボードの外枠に合わせて「基準撮影」を押してください";
      requestAnimationFrame(updateLoop);
    } catch (err) { alert("カメラエラー: " + err); }
  }

  function captureBase() {
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    baseImageData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
    throws = [null, null, null]; currentThrowIndex = 0;
    isDetecting = true;
    statusMsg.innerText = "🎯 判定中...";
  }

  function updateLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      drawDeformedBoard();
    }
    requestAnimationFrame(updateLoop);
  }

  // 4点から補正された網目を描画（簡易パース補正）
  function drawDeformedBoard() {
    // 中心点の補算
    const centerX = (points[0].x + points[1].x + points[2].x + points[3].x) / 4;
    const centerY = (points[0].y + points[1].y + points[2].y + points[3].y) / 4;

    ctx.strokeStyle = "rgba(0, 255, 204, 0.8)";
    ctx.lineWidth = 2;

    // 4点を結ぶ外枠
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    ctx.lineTo(points[1].x, points[1].y);
    ctx.lineTo(points[2].x, points[2].y);
    ctx.lineTo(points[3].x, points[3].y);
    ctx.closePath();
    ctx.stroke();

    // 制御点の描画
    points.forEach((p, idx) => {
      ctx.fillStyle = draggingIdx === idx ? "#ff0055" : "#00ffcc";
      ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); ctx.fill();
    });

    // 放射状のセグメント分割線
    for (let i = 0; i < 20; i++) {
      let angle = (i * 18 - 90) * Math.PI / 180;
      // 角度ごとの歪み外線補間
      let targetX = centerX + Math.cos(angle) * 280;
      let targetY = centerY + Math.sin(angle) * 280;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(targetX, targetY);
      ctx.strokeStyle = "rgba(0, 255, 204, 0.2)";
      ctx.stroke();
    }
  }

  function startApp() {
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('cam-controls').style.display = 'flex';
    document.getElementById('board-container').style.display = 'inline-block';
    document.getElementById('game-ui').style.display = 'block';
  }
</script>
</body>
</html>
