<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ダーツ自動判定＆手直しシステム Ver 2.2</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      text-align: center; 
      background-color: #121212; 
      color: #fff; 
      margin: 0; 
      padding: 10px;
      touch-action: manipulation;
    }
    h1 { font-size: 1.2rem; margin: 5px 0; }
    .version-tag { font-size: 0.8rem; color: #00ffcc; margin-left: 5px; }
    #board-container { position: relative; display: inline-block; margin: 5px auto; }
    video { display: none; }
    canvas { 
      display: block; 
      border-radius: 50%; 
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); 
      background: #000;
      width: 340px;
      height: 340px;
    }
    #status-msg { font-size: 1rem; color: #00ffcc; margin: 5px 0; font-weight: bold; min-height: 1.5rem; }
    
    .throws-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }
    .throw-box {
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 12px;
      min-width: 80px;
      cursor: pointer;
    }
    .throw-box.active { border-color: #00ffcc; box-shadow: 0 0 8px #00ffcc; }
    .throw-label { font-size: 0.75rem; color: #888; }
    .throw-score { font-size: 1.2rem; font-weight: bold; color: #fff; margin-top: 2px; }

    .total-score { font-size: 1.5rem; color: #ff9800; font-weight: bold; margin: 5px 0; }

    .controls { margin-bottom: 10px; display: flex; justify-content: center; gap: 8px; }
    .panel { background: #1e1e1e; padding: 10px; border-radius: 12px; max-width: 420px; margin: 5px auto; border: 1px solid #333; }
    .panel-title { font-size: 0.9rem; color: #aaa; margin-bottom: 8px; }
    .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    
    button { 
      padding: 10px 12px; 
      font-size: 0.95rem; 
      border: none; 
      border-radius: 6px; 
      background-color: #333; 
      color: #fff; 
      cursor: pointer; 
      flex-grow: 1; 
      min-width: 40px;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background-color: #555; }
    button.action-btn { background-color: #ff9800; font-weight: bold; color: #000; }
    button.confirm-btn { background-color: #00cc88; font-weight: bold; color: #000; font-size: 1.1rem; padding: 12px; }
    button.multiplier { background-color: #005588; font-weight: bold;}
    button.active { background-color: #00cc88; box-shadow: 0 0 10px #00cc88; }
    button.special { background-color: #aa2222; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>🎯 ダーツ自動判定 <span class="version-tag">Ver 2.2</span></h1>

  <video id="video" autoplay playsinline></video>
  
  <div class="controls">
    <button class="action-btn" onclick="startCamera()">📷 1. カメラ起動</button>
    <button class="action-btn" id="btn-base" onclick="captureBase()" disabled>🎯 2. 基準撮影(開始)</button>
  </div>

  <div id="board-container">
    <canvas id="dartboard" width="720" height="720"></canvas>
  </div>

  <div id="status-msg">「1. カメラ起動」を押してください</div>

  <div class="throws-container">
    <div class="throw-box" id="box-1">
      <div class="throw-label">1投目</div>
      <div class="throw-score" id="score-1">-</div>
    </div>
    <div class="throw-box" id="box-2">
      <div class="throw-label">2投目</div>
      <div class="throw-score" id="score-2">-</div>
    </div>
    <div class="throw-box" id="box-3">
      <div class="throw-label">3投目</div>
      <div class="throw-score" id="score-3">-</div>
    </div>
  </div>

  <div class="total-score" id="total-display">合計: 0 点</div>

  <div class="panel" id="action-panel">
    <button class="confirm-btn" id="btn-confirm" onclick="confirmRound()" style="width: 100%; margin-bottom: 10px;" disabled>✅ 点数を確定して次のラウンドへ</button>

    <div class="panel-title">🔧 スコアを手動修正 (枠をタップして選択)</div>
    <div class="btn-group" style="margin-bottom: 8px;">
      <button class="multiplier active" id="btn-S" onclick="setMultiplier('S')">Single</button>
      <button class="multiplier" id="btn-D" onclick="setMultiplier('D')">Double</button>
      <button class="multiplier" id="btn-T" onclick="setMultiplier('T')">Triple</button>
    </div>

    <div class="btn-group">
      <script>
        const nums = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
        nums.forEach(i => {
          document.write(`<button onclick="manualScore(${i})">${i}</button>`);
        });
      </script>
      <button class="special" onclick="manualSpecial('S-BULL', 25)">S-BULL</button>
      <button class="special" onclick="manualSpecial('D-BULL', 50)">D-BULL</button>
      <button onclick="manualSpecial('OUT', 0)">OUT</button>
    </div>
  </div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('dartboard');
  const ctx = canvas.getContext('2d');
  const statusMsg = document.getElementById('status-msg');
  
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const doubleOuterRadius = Math.min(centerX, centerY) * 0.78;
  const BOARD_NUMBERS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];

  const procCanvas = document.createElement('canvas');
  procCanvas.width = 180;
  procCanvas.height = 180;
  const procCtx = procCanvas.getContext('2d');

  let baseImageData = null;
  let currentMultiplier = 'S';
  
  let throws = [null, null, null];
  let currentThrowIndex = 0;
  let selectedSlotIndex = 0;
  let isDetecting = false;
  let lastHitTime = 0;

  async function startCamera() {
    statusMsg.innerText = "カメラ起動中...";
    try {
      let stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 1280 } }
      });
      video.srcObject = stream;
      await video.play();
      document.getElementById('btn-base').disabled = false;
      statusMsg.innerText = "「2. 基準撮影」を押してください";
      requestAnimationFrame(updateLoop);
    } catch (err) {
      alert("カメラエラー: " + err);
      statusMsg.innerText = "カメラ起動失敗";
    }
  }

  function captureBase() {
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    baseImageData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
    
    throws = [null, null, null];
    currentThrowIndex = 0;
    selectedSlotIndex = 0;
    updateUI();
    
    isDetecting = true;
    statusMsg.innerText = "🎯 ダーツを投げてくだい (1投目)";
  }

  function updateLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      if (isDetecting && baseImageData && currentThrowIndex < 3) {
        const now = Date.now();
        if (now - lastHitTime > 2000) {
          detectDartHit();
        }
      }

      drawOverlayBoard();
      drawHitPoints();
    }
    requestAnimationFrame(updateLoop);
  }

  function detectDartHit() {
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    const currentData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);

    let changedPixels = [];
    const totalPixels = procCanvas.width * procCanvas.height;

    for (let i = 0; i < currentData.data.length; i += 4) {
      const rDiff = Math.abs(currentData.data[i] - baseImageData.data[i]);
      const gDiff = Math.abs(currentData.data[i+1] - baseImageData.data[i+1]);
      const bDiff = Math.abs(currentData.data[i+2] - baseImageData.data[i+2]);
      const diff = rDiff + gDiff + bDiff;

      if (diff > 135) {
        const pixelIdx = i / 4;
        const px = pixelIdx % procCanvas.width;
        const py = Math.floor(pixelIdx / procCanvas.width);
        changedPixels.push({ x: px, y: py });
      }
    }

    const diffCount = changedPixels.length;

    if (diffCount > totalPixels * 0.12) {
      statusMsg.innerText = "⚠️ 明るさ/位置のズレを検知。自動補正中...";
      baseImageData = currentData;
      return;
    }

    if (diffCount >= 25 && diffCount <= totalPixels * 0.10) {
      let sumX = 0, sumY = 0;
      changedPixels.forEach(p => { sumX += p.x; sumY += p.y; });
      const avgPx = sumX / diffCount;
      const avgPy = sumY / diffCount;

      let spreadRadius = 0;
      changedPixels.forEach(p => {
        spreadRadius += Math.hypot(p.x - avgPx, p.y - avgPy);
      });
      spreadRadius /= diffCount;

      if (spreadRadius < 25) {
        const canvasX = (avgPx / procCanvas.width) * canvas.width;
        const canvasY = (avgPy / procCanvas.height) * canvas.height;

        const score = calculateScore(canvasX, canvasY);
        
        throws[currentThrowIndex] = { label: score.text, pts: score.pts, x: canvasX, y: canvasY };
        lastHitTime = Date.now();

        baseImageData = currentData;

        currentThrowIndex++;
        if (currentThrowIndex >= 3) {
          isDetecting = false;
          statusMsg.innerText = "3投完了！内容を確認して確定してください";
        } else {
          statusMsg.innerText = `🎯 ダーツを投げてくだい (${currentThrowIndex + 1}投目)`;
        }

        selectedSlotIndex = Math.min(currentThrowIndex, 2);
        updateUI();
      }
    }
  }

  function updateUI() {
    for (let i = 0; i < 3; i++) {
      const box = document.getElementById(`box-${i+1}`);
      const scoreText = document.getElementById(`score-${i+1}`);
      
      if (throws[i]) {
        scoreText.innerText = throws[i].label;
      } else {
        scoreText.innerText = "-";
      }

      if (i === selectedSlotIndex) {
        box.classList.add('active');
      } else {
        box.classList.remove('active');
      }
    }

    const total = throws.reduce((sum, t) => sum + (t ? t.pts : 0), 0);
    document.getElementById('total-display').innerText = `合計: ${total} 点`;

    document.getElementById('btn-confirm').disabled = (currentThrowIndex < 3 && !throws.some(t => t !== null));
  }

  // --- 枠線・セグメント境界ガイド描画 ---
  function drawOverlayBoard() {
    ctx.strokeStyle = "rgba(0, 255, 204, 0.85)";
    ctx.lineWidth = 2.5;

    // 1. 同心円（リング線）の描画
    ctx.beginPath(); ctx.arc(centerX, centerY, doubleOuterRadius, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(centerX, centerY, doubleOuterRadius * 0.92, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(centerX, centerY, doubleOuterRadius * 0.65, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(centerX, centerY, doubleOuterRadius * 0.58, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(centerX, centerY, doubleOuterRadius * 0.09, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(centerX, centerY, doubleOuterRadius * 0.04, 0, Math.PI * 2); ctx.stroke();

    // 2. 縦線（セグメントを区切る放射状の20分割線）と数字の描画
    const innerBullRadius = doubleOuterRadius * 0.09;

    for (let i = 0; i < 20; i++) {
      // ナンバーテキストの位置角度（各セグメントの中央）
      const textAngleRad = (i * 18 - 90) * Math.PI / 180;
      const textRadius = doubleOuterRadius * 1.12;
      const tx = centerX + textRadius * Math.cos(textAngleRad);
      const ty = centerY + textRadius * Math.sin(textAngleRad);

      ctx.fillStyle = "#00ffcc";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(BOARD_NUMBERS[i], tx, ty);

      // セグメント同士を区切る縦線の角度（テキスト位置から9度ずらした境界線）
      const lineAngleRad = (i * 18 - 90 - 9) * Math.PI / 180;
      
      const startX = centerX + innerBullRadius * Math.cos(lineAngleRad);
      const startY = centerY + innerBullRadius * Math.sin(lineAngleRad);
      const endX = centerX + doubleOuterRadius * Math.cos(lineAngleRad);
      const endY = centerY + doubleOuterRadius * Math.sin(lineAngleRad);

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
    }
  }

  function drawHitPoints() {
    throws.forEach((t, idx) => {
      if (t && t.x && t.y) {
        ctx.beginPath();
        ctx.arc(t.x, t.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = idx === selectedSlotIndex ? "rgba(255, 0, 85, 1.0)" : "rgba(255, 152, 0, 0.8)";
        ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(idx + 1, t.x, t.y);
      }
    });
  }

  function calculateScore(x, y) {
    const dx = x - centerX;
    const dy = y - centerY;
    const distance = Math.hypot(dx, dy);
    const r = distance / doubleOuterRadius;

    if (r <= 0.04) return { text: "D-BULL", pts: 50 };
    if (r <= 0.09) return { text: "S-BULL", pts: 25 };
    if (r > 1.0)  return { text: "OUT", pts: 0 };

    let angleRad = Math.atan2(dx, -dy);
    let angleDeg = (angleRad * 180 / Math.PI + 360) % 360;
    let adjustedAngle = (angleDeg + 9) % 360;
    let index = Math.floor(adjustedAngle / 18);
    let num = BOARD_NUMBERS[index];

    if (r >= 0.58 && r <= 0.65) return { text: `T${num}`, pts: num * 3 };
    if (r >= 0.92 && r <= 1.0) return { text: `D${num}`, pts: num * 2 };
    return { text: `S${num}`, pts: num };
  }

  document.getElementById('box-1').onclick = () => { selectedSlotIndex = 0; updateUI(); };
  document.getElementById('box-2').onclick = () => { selectedSlotIndex = 1; updateUI(); };
  document.getElementById('box-3').onclick = () => { selectedSlotIndex = 2; updateUI(); };

  function setMultiplier(type) {
    currentMultiplier = type;
    document.querySelectorAll('.multiplier').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${type}`).classList.add('active');
  }

  function manualScore(num) {
    let multText = currentMultiplier === 'T' ? 'T' : (currentMultiplier === 'D' ? 'D' : 'S');
    let multVal = currentMultiplier === 'T' ? 3 : (currentMultiplier === 'D' ? 2 : 1);
    throws[selectedSlotIndex] = { label: `${multText}${num}`, pts: num * multVal, x: null, y: null };
    updateUI();
  }

  function manualSpecial(label, pts) {
    throws[selectedSlotIndex] = { label: label, pts: pts, x: null, y: null };
    updateUI();
  }

  function confirmRound() {
    alert(`【ラウンド確定】\n${document.getElementById('total-display').innerText}`);
    captureBase();
  }

  drawOverlayBoard();
</script>

</body>
</html>
